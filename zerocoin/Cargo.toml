[package]
name = "zerocoin"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "ZeroCoin (ZRO) — a fair-launch, zero-premine, ownerless UTXO cryptocurrency built on the payd architecture."
license = "MIT"
authors = ["ZeroCoin Community"]

# ZeroCoin mirrors Bitcoin's architecture with two deliberate deviations:
#   1. a 60-second block time with a 1,440-block (24h) retarget window, and
#   2. a CPU-friendly, ASIC-resistant Proof-of-Work instead of SHA-256d.
# Every cryptographic primitive here is a battle-tested RustCrypto crate; there is
# no hand-rolled cryptography. secp256k1 is provided by `k256`.

[features]
# The Slint wallet GUI is a *front-end* concern: the daemon, the CLI and the
# shared core (`zerocoin::session`) carry no UI dependencies. `gui` is on by
# default so `cargo build --bins` still produces all three binaries, while
# `--no-default-features` yields a UI-free core whose library cross-checks for
# targets whose GUI stack needs extra SDKs, e.g.
#   cargo check --target aarch64-linux-android --lib --no-default-features
default = ["gui"]
gui = ["dep:slint", "dep:arboard", "dep:rfd"]

# The wallet UI compiles two ways: `rlib` so the desktop `zerocoin-gui`
# binary and the test harness link it like any other module, and `cdylib`
# so Android can load the same code as a native library and call its
# `android_main` — Android has no Rust `main`.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"

# Hashing / MACs
sha2 = "0.10"
ripemd = "0.1"
hmac = "0.12"

# secp256k1 ECDSA signatures + keys (RustCrypto's `k256` is the secp256k1 curve).
# `ecdh` powers the authenticated P2P handshake; `sha256` is used for sighash.
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "ecdh", "sha256", "pkcs8", "pem"] }

# Wallet-at-rest: AES-256-GCM sealing over an argon2id-derived key
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }

# Key derivation for the handshake (shared secret -> session keys)
hkdf = "0.12"

# Randomness (keygen, salts, nonces, mining nonce search)
rand = "0.8"
getrandom = "0.2"

# Base58Check for Bitcoin-style P2PKH addresses
bs58 = { version = "0.5", features = ["check"] }

# Constant-time comparisons for MACs and secrets
subtle = "2.5"

# The Slint GUI. `slint-build` (see build.rs) compiles `ui/wallet.slint`.
# The dependency is optional: the default `gui` feature enables it (see
# [features] above), and `--no-default-features` builds the daemon, CLI and
# shared core with no UI stack at all — the subset that cross-checks cleanly
# for platforms whose GUI front-end needs extra SDKs (Android).
# The feature sets are per target because Cargo features are additive and a
# plain `[dependencies]` entry applies to *every* target: this common entry
# therefore carries only what all platforms share (the renderers and the
# accessibility layer), the desktop table below adds the winit backend and
# the system tray, and the Android table swaps in the native-activity
# backend. `tokio` runs the desktop wallet's RPC client off the UI thread so
# cryptographic signing never stalls rendering, and its `process` feature
# lets the self-contained desktop wallet spawn the embedded `zerocoind`
# (`tokio::process::Command`) when nothing is listening on the RPC port yet.
slint = { version = "1.18.1", default-features = false, optional = true, features = ["std", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "time", "process"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# The quick-copy button needs the OS clipboard. Slint 1.18 exposes no public
# clipboard API (its `Platform::set_clipboard_text` is backend-internal), so we
# use `arboard`, the crate the Slint maintainers recommend for this exact case.
# Desktop-only: arboard has no Android backend; the GUI cfg-gates its single
# call site (`copy_to_clipboard`). Optional — only the `gui` feature pulls it.
arboard = { version = "3.6.1", optional = true }

# The mandatory Wallet Export / Download Shield after account creation needs
# the platform's native "save file" dialog (IFileSaveDialog on Windows).
# Slint exposes no file-dialog API, so `rfd` provides it; its blocking dialog
# is invoked from a dedicated thread so the Slint event loop never freezes.
# Desktop-only: rfd 0.15 has no Android dialog backend and does not compile
# for the target, so the Android build does not include it. Optional — only
# the `gui` feature pulls it.
rfd = { version = "0.15", optional = true }

# Desktop window system (winit) plus the optional system-tray integration;
# together with the common entry above this mirrors the crate's default
# feature set on desktop exactly.
slint = { version = "1.18.1", default-features = false, optional = true, features = ["backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "system-tray"] }

[target.'cfg(target_os = "android")'.dependencies]
# Android renders through the platform's native activity: the OS owns the
# event loop and calls the `android_main` entry point exported by the
# library (`zerocoin::gui`).
slint = { version = "1.18.1", default-features = false, optional = true, features = ["backend-android-activity-06"] }

# Slint exposes no clipboard API and Android has no `arboard` backend, so
# the GUI's copy button talks to the platform's ClipboardManager through
# JNI directly; `ndk-context` hands it the `JavaVM` + Activity jobject that
# the android-activity glue already registered at startup. Android-only by
# way of this target table, so desktop builds never see them.
jni = "0.21"
ndk-context = "0.1"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"

[[bin]]
name = "zerocoind"
path = "src/bin/zerocoind.rs"

[[bin]]
name = "zerocoin-cli"
path = "src/bin/zerocoin_cli.rs"

[[bin]]
name = "zerocoin-gui"
path = "src/bin/zerocoin_gui.rs"
# Built only with the `gui` feature (on by default), so a
# `--no-default-features` core build skips the binary outright.
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# `cargo apk` packaging: the crate's `cdylib` becomes the app's native
# library inside an APK built for 64-bit ARM devices. minSdk 26 is the floor
# of the Slint android-activity backend (and Android 8.0, the oldest version
# the wallet's storage/TLS stack supports); targetSdk 35 matches the
# installed platform.
[package.metadata.android]
package = "org.zerocoin.wallet"
apk_name = "zerocoin"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "ZeroCoin"
